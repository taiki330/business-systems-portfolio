<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<base target="_top">
<style>
  :root{ --line:#d8dde5; --ink:#1a1a1a; --sub:#5a6270; --accent:#1e5aa8;
         --soft:#f4f6f9; --ok:#1e7a4d; --warn:#b3541e; --err:#c0392b; }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Yu Gothic",YuGothic,"Hiragino Kaku Gothic ProN","Meiryo",sans-serif;
       color:var(--ink);background:#eef1f5;font-size:14px;}
  header{background:#fff;border-bottom:2px solid var(--accent);padding:14px 16px;
         box-shadow:0 1px 6px rgba(0,0,0,.06);}
  .back{display:inline-block;margin-bottom:8px;font-size:13px;font-weight:700;color:var(--accent);text-decoration:none;}
  h1{font-size:17px;margin:0;display:flex;align-items:center;gap:10px;}
  .clinicTag{display:inline-block;background:var(--accent);color:#fff;font-weight:700;padding:2px 12px;border-radius:13px;font-size:14px;}
  main{max-width:560px;margin:0 auto;padding:16px;}
  a{color:var(--accent);}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12.5px;color:var(--sub);margin-bottom:4px;font-weight:700;}
  .field .req{color:var(--err);}
  input,select{width:100%;font-size:15px;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;}
  .row2{display:flex;gap:10px;}
  .row2 .field{flex:1;}
  .hint{font-size:11.5px;color:var(--sub);margin-top:3px;}
  button{cursor:pointer;font-size:15px;font-weight:700;border:none;border-radius:8px;padding:12px 18px;}
  .primary{background:var(--ok);color:#fff;width:100%;}
  .ghost{background:#fff;color:var(--accent);border:1px solid var(--accent);}
  button:disabled{opacity:.5;cursor:not-allowed;}
  .msg{margin-top:10px;font-size:13px;min-height:18px;}
  .msg.err{color:var(--err);}
  .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.05);}
  .result{margin-top:16px;text-align:center;}
  .result .qrbox{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;display:inline-block;}
  .result img{display:block;width:220px;height:220px;}
  .result .pid{font-weight:800;color:var(--accent);margin-top:8px;font-size:16px;}
  .result .nm{margin-top:2px;}
  .result .note{font-size:12px;color:var(--sub);margin-top:6px;}
  .warnbox{background:#fdf1e7;border:1px solid #f0c7a6;color:var(--warn);border-radius:8px;padding:10px 12px;font-size:12.5px;margin-top:10px;}
  .btnrow{display:flex;gap:10px;margin-top:14px;justify-content:center;flex-wrap:wrap;}
  @media print{
    header,.form,.btnrow,.back{display:none;}
    body{background:#fff;}
    .result img{width:260px;height:260px;}
  }
</style>
</head>
<body>
<header>
  <a class="back" id="homeBack" href="#">← 医院ホームに戻る</a>
  <h1 id="title">資材を追加</h1>
</header>
<main>
  <div id="app"><div class="card" style="text-align:center;color:var(--sub);">読み込み中…</div></div>
</main>

<script>
  var CLINIC_KEY = 'tanaoroshi_clinic';
  var APP_URL = '<?= initParams && initParams.appUrl ? initParams.appUrl : "" ?>';
  var CLINIC  = '<?= initParams && initParams.clinic ? initParams.clinic : "" ?>';
  var $ = function(id){ return document.getElementById(id); };

  // 医院はURL優先、無ければ端末記憶から
  if(!CLINIC){ try { CLINIC = localStorage.getItem(CLINIC_KEY) || ''; } catch(e){} }
  else { try { localStorage.setItem(CLINIC_KEY, CLINIC); } catch(e){} }

  // 戻るリンク
  $('homeBack').href = APP_URL + '?page=home' + (CLINIC ? '&clinic=' + encodeURIComponent(CLINIC) : '');

  if(!CLINIC){
    $('app').innerHTML = '<div class="card" style="color:var(--err);">医院が指定されていません。'
      + '医院ホームから開いてください。</div>';
  } else {
    $('title').innerHTML = '<span class="clinicTag">' + esc(CLINIC) + '</span> 資材を追加';
    renderForm();
  }

  function renderForm(){
    $('app').innerHTML =
      '<div class="card form" id="form">'
      + field('カテゴリ', '<input type="text" id="f_category" placeholder="例：グローブ">')
      + '<div class="row2">'
        + field('発注先', '<select id="f_supplier_sel"><option value="">（未設定）</option>'
            + '<option value="__other__">その他（自由入力）</option></select>'
            + '<input type="text" id="f_supplier" placeholder="発注先を入力" style="display:none;margin-top:4px;">')
        + field('品名 <span class="req">*必須</span>', '<input type="text" id="f_name" placeholder="例：ニトリルグローブ M">')
      + '</div>'
      + field('管理方式 <span class="req">*必須</span>',
          '<select id="f_mode">'
          + '<option value="数量管理">数量管理</option>'
          + '<option value="発注トリガー管理">発注トリガー管理</option>'
          + '</select>')
      + '<div id="qtyWrap">'
        + '<div class="row2">'
          + field('初期在庫数', '<input type="number" id="f_stock" min="0" step="1" placeholder="例：10">')
          + field('発注基準数', '<input type="number" id="f_kijun" min="0" step="1" placeholder="この数量以下で発注">')
        + '</div>'
      + '</div>'
      + field('税抜価格（円）', '<input type="number" id="f_price" min="0" step="1" placeholder="任意">')
      + '<button class="primary" id="addBtn">この内容で追加する</button>'
      + '<div class="msg" id="msg"></div>'
      + '</div>'
      + '<div id="result"></div>';

    $('f_mode').onchange = syncMode;
    $('addBtn').onclick = submit;
    $('f_supplier_sel').onchange = syncSupplier;
    syncMode();
    loadSupplierOptions();
    $('f_name').focus();
  }

  // 発注先：商品マスタに登録済みの発注先から選ぶ。無い発注先は「その他」で入力すると、
  // 保存後は商品マスタの選択肢に加わり、次回から一覧に出る。
  function loadSupplierOptions(){
    google.script.run.withSuccessHandler(function(list){
      var sel = $('f_supplier_sel');
      if(!sel) return;
      sel.innerHTML = '<option value="">（未設定）</option>'
        + (list||[]).map(function(s){ return '<option value="'+esc(s)+'">'+esc(s)+'</option>'; }).join('')
        + '<option value="__other__">その他（自由入力）</option>';
    }).getSupplierOptions();
  }

  function syncSupplier(){
    var other = $('f_supplier_sel').value === '__other__';
    $('f_supplier').style.display = other ? 'block' : 'none';
    if(other){ $('f_supplier').value=''; $('f_supplier').focus(); } else { $('f_supplier').value=''; }
  }

  function supplierValue(){
    var sel = $('f_supplier_sel');
    if(!sel) return '';
    return sel.value === '__other__' ? $('f_supplier').value.trim() : sel.value;
  }

  // 発注基準数は数量管理のときだけ有効。発注トリガー管理は在庫数を持たない。
  function syncMode(){
    var isQty = $('f_mode').value === '数量管理';
    $('qtyWrap').style.display = isQty ? 'block' : 'none';
    if(!isQty){ $('f_stock').value=''; $('f_kijun').value=''; }
  }

  function setMsg(m, isErr){
    var el = $('msg'); el.textContent = m||''; el.className = 'msg' + (isErr?' err':'');
  }

  function submit(){
    var name = $('f_name').value.trim();
    if(!name){ setMsg('品名を入力してください。', true); $('f_name').focus(); return; }
    var item = {
      category: $('f_category').value.trim(),
      supplier: supplierValue(),
      name:     name,
      mode:     $('f_mode').value,
      stock:    ($('f_mode').value==='数量管理') ? $('f_stock').value.trim() : '',
      kijun:    ($('f_mode').value==='数量管理') ? $('f_kijun').value.trim() : '',
      price:    $('f_price').value.trim()
    };
    $('addBtn').disabled = true;
    setMsg('追加中…');
    google.script.run
      .withSuccessHandler(function(res){
        $('addBtn').disabled = false;
        setMsg('');
        showResult(res);
      })
      .withFailureHandler(function(err){
        $('addBtn').disabled = false;
        setMsg('追加できませんでした：' + (err && err.message), true);
      })
      .addProductForClinic(CLINIC, item);
  }

  function showResult(res){
    var reuse = res.reused
      ? '<div class="note">※ 同じ資材が商品マスタに既にあったため、その商品IDを使いこの医院の在庫に追加しました。</div>'
      : '';
    var qr = res.deployed
      ? '<div class="qrbox"><img src="' + esc(res.qrImageUrl) + '" alt="QR"></div>'
      : '<div class="warnbox">QR画像はウェブアプリのデプロイ後に表示されます（商品IDは発行済み：' + esc(res.productId) + '）。</div>';
    $('result').innerHTML =
      '<div class="result">'
      + '<div style="font-weight:800;color:var(--ok);margin-bottom:10px;">✓ 「' + esc(res.name) + '」を追加しました</div>'
      + qr
      + '<div class="pid">' + esc(res.productId) + '</div>'
      + '<div class="nm">' + esc(res.name) + '</div>'
      + reuse
      + '<div class="btnrow">'
        + (res.deployed ? '<button class="ghost" onclick="window.print()">このQRを印刷</button>' : '')
        + '<button class="ghost" id="againBtn">続けて追加</button>'
      + '</div>'
      + '</div>';
    // 入力欄はカテゴリ・発注先を残して品名・数量・単価をクリア（連続追加しやすく）
    $('f_name').value=''; $('f_stock').value=''; $('f_kijun').value=''; $('f_price').value='';
    var again = $('againBtn');
    if(again) again.onclick = function(){ $('result').innerHTML=''; $('f_name').focus(); };
    $('result').scrollIntoView({behavior:'smooth', block:'nearest'});
  }

  function field(label, control){
    return '<div class="field"><label>' + label + '</label>' + control + '</div>';
  }
  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g,function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
</script>
</body>
</html>
