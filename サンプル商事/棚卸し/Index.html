<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<base target="_top">
<style>
  :root{
    --line:#d8dde5; --ink:#1a1a1a; --sub:#5a6270; --accent:#1e5aa8;
    --soft:#f4f6f9; --changed:#fff7e0; --del:#fde8e8; --ok:#1e7a4d;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Yu Gothic",YuGothic,"Hiragino Kaku Gothic ProN","Meiryo",sans-serif;
       color:var(--ink);background:#eef1f5;font-size:14px;}
  header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:2px solid var(--accent);
         padding:12px 16px;box-shadow:0 1px 6px rgba(0,0,0,.06);}
  h1{font-size:17px;margin:0 0 10px;}
  .clinicTag{display:inline-block;background:var(--accent);color:#fff;font-size:14px;padding:2px 10px;border-radius:13px;margin-right:6px;}
  .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .modeTabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
  .modeTab{cursor:pointer;border:1px solid var(--accent);border-radius:18px;padding:6px 14px;
           background:#fff;color:var(--accent);font-weight:700;font-size:13px;}
  .modeTab.active{background:var(--accent);color:#fff;}
  select,input[type=text],button{font-size:14px;padding:6px 10px;border:1px solid var(--line);
       border-radius:5px;background:#fff;}
  button{cursor:pointer;background:var(--accent);color:#fff;border:none;font-weight:700;}
  button.ghost{background:#fff;color:var(--accent);border:1px solid var(--accent);}
  button:disabled{opacity:.5;cursor:not-allowed;}
  .bulkbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;
           padding:8px 10px;background:var(--soft);border-radius:6px;}
  .bulkbar .count{font-weight:700;color:var(--accent);}
  main{padding:12px 16px 90px;}
  table{width:100%;border-collapse:collapse;background:#fff;}
  th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:middle;}
  th{background:var(--soft);position:sticky;top:0;font-size:12.5px;white-space:nowrap;}
  td.num{text-align:right;}
  tr.changed td{background:var(--changed);}
  /* 取り扱いなし：削除ではなく「下に控える」表現（グレーアウト） */
  tr.parked td{background:#f2f3f5;color:#9098a5;}
  tr.parked .cat{opacity:.6;}
  tr.parked select{color:var(--ink);}
  .rowsel{width:16px;height:16px;}
  .modesel{width:100%;min-width:130px;}
  .kijun{width:80px;text-align:right;padding:5px 6px;}
  .kijun:disabled{background:#f0f1f3;color:#b3b8c0;}
  .kijununit{color:var(--sub);font-size:12px;margin-left:4px;}
  td.kijuncell{white-space:nowrap;}
  .expdate{width:150px;padding:5px 6px;}
  .expdate:disabled{background:#f0f1f3;color:#b3b8c0;}
  td.expcell{white-space:nowrap;}
  .expman{padding:5px 6px;}
  .na{color:#b3b8c0;}
  .cat{display:inline-block;font-size:11px;color:var(--sub);background:#eef2f8;
       padding:1px 6px;border-radius:3px;}
  footer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);
         padding:10px 16px;display:flex;gap:12px;align-items:center;justify-content:flex-end;
         box-shadow:0 -1px 6px rgba(0,0,0,.06);}
  footer .status{margin-right:auto;color:var(--sub);}
  .savebtn{background:var(--ok);padding:9px 22px;}
  .empty{padding:40px;text-align:center;color:var(--sub);}
  .spin{color:var(--sub);padding:20px;text-align:center;}
</style>
</head>
<body>
<header>
  <a id="homeBack" href="#" style="display:inline-block;margin-bottom:8px;font-size:13px;font-weight:700;color:var(--accent);text-decoration:none;">← 医院ホームに戻る</a>
  <h1><span class="clinicTag" id="clinicTag">医院未指定</span>管理方式 設定</h1>
  <div class="bar">
    <label>カテゴリ：
      <select id="catFilter"><option value="">すべて</option></select>
    </label>
    <input type="text" id="search" placeholder="品名・発注先で絞り込み" style="min-width:200px;">
  </div>
  <div class="modeTabs" aria-label="管理方式で絞り込み">
    <button type="button" class="modeTab active" data-mode-tab="all">すべて（<span id="countAll">0</span>件）</button>
    <button type="button" class="modeTab" data-mode-tab="発注トリガー管理">発注トリガー管理（<span id="countTrigger">0</span>件）</button>
    <button type="button" class="modeTab" data-mode-tab="数量管理">数量管理（<span id="countQty">0</span>件）</button>
  </div>
  <div class="bulkbar">
    <label><input type="checkbox" id="selAll"> 表示中を全選択</label>
    <span class="count"><span id="selCount">0</span> 件選択中</span>
    <span style="margin-left:8px;">まとめて設定 →</span>
    <select id="bulkMode">
      <option value="数量管理">数量管理</option>
      <option value="発注トリガー管理">発注トリガー管理</option>
      <option value="取り扱いなし">取り扱いなし</option>
      <option value="">未設定に戻す</option>
    </select>
    <span id="bulkKijunWrap">発注基準数
      <input type="number" id="bulkKijun" class="kijun" min="0" step="1" placeholder="任意">
    </span>
    <button id="applyBulk" class="ghost">選択項目に適用</button>
  </div>
</header>

<main>
  <div id="tableWrap"><div class="empty">読み込み中…</div></div>
</main>

<footer>
  <span class="status" id="status"></span>
  <span id="changeInfo" style="color:var(--sub);"></span>
  <button class="savebtn" id="saveBtn" disabled>保存する</button>
</footer>

<script>
  var MODE_OPTS = ['', '数量管理', '発注トリガー管理', '取り扱いなし'];
  var MODE_LABEL = {'':'未設定','数量管理':'数量管理','発注トリガー管理':'発注トリガー管理','取り扱いなし':'取り扱いなし'};
  var state = { clinic:'', items:[], live:false, modeTab:'all' };  // items: {row,category,supplier,name,stock,mode(original),cur(current)}
  // 使用期限の列は運用中の医院（医院別在庫を直接編集する医院）でのみ表示する。
  var EXPMAN_YES = '要', EXPMAN_NO = '不要';
  var CLINIC = '<?= initParams && initParams.clinic ? initParams.clinic : "" ?>';
  var APP_URL = '<?= initParams && initParams.appUrl ? initParams.appUrl : "" ?>';
  document.getElementById('homeBack').href = APP_URL + '?page=home' + (CLINIC ? '&clinic=' + encodeURIComponent(CLINIC) : '');
  if (!CLINIC) document.getElementById('homeBack').style.display = 'none';

  document.getElementById('catFilter').onchange = render;
  document.getElementById('search').oninput = render;
  document.getElementById('selAll').onchange = onSelectAll;
  document.getElementById('applyBulk').onclick = applyBulk;
  document.getElementById('bulkMode').onchange = syncBulkKijun;
  document.getElementById('saveBtn').onclick = save;
  document.querySelectorAll('[data-mode-tab]').forEach(function(btn){
    btn.onclick = function(){
      state.modeTab = this.getAttribute('data-mode-tab');
      document.querySelectorAll('[data-mode-tab]').forEach(function(b){
        b.className = 'modeTab' + (b.getAttribute('data-mode-tab') === state.modeTab ? ' active' : '');
      });
      render();
    };
  });
  syncBulkKijun();
  if(!CLINIC){
    document.getElementById('tableWrap').innerHTML = '<div class="empty">医院が指定されていません。医院ホームから開いてください。</div>';
  } else {
    document.getElementById('clinicTag').textContent = CLINIC;
    loadClinic();
  }

  // まとめて設定の発注基準数入力は「数量管理」を選んだときだけ有効にする
  function syncBulkKijun(){
    var isQty = document.getElementById('bulkMode').value === '数量管理';
    var wrap = document.getElementById('bulkKijunWrap');
    var inp = document.getElementById('bulkKijun');
    inp.disabled = !isQty;
    if(!isQty) inp.value = '';
    wrap.style.opacity = isQty ? '1' : '.45';
  }

  function setStatus(msg){ document.getElementById('status').textContent = msg||''; }

  function loadClinic(){
    var clinic = CLINIC;
    document.getElementById('tableWrap').innerHTML = '<div class="spin">読み込み中…</div>';
    setStatus('');
    google.script.run
      .withSuccessHandler(function(res){
        state.clinic = res.clinic;
        state.live = !!res.live;
        state.items = res.items.map(function(it){
          it.cur = it.mode;          // 現在選択中の管理方式
          it.curKijun = it.kijun;    // 現在入力中の発注基準数（文字列で保持）
          it.curExpMan = it.expiryManaged || EXPMAN_NO; // 使用期限管理（要/不要）
          it.curExpiry = it.expiry || '';               // 使用期限（YYYY-MM-DD）
          return it;
        });
        buildCatFilter();
        updateModeTabCounts();
        render();
        var syncMsg = res.synced ? ('／一覧漏れ '+res.synced+' 件を自動追加しました') : '';
        setStatus(res.items.length + ' 件を読み込みました（' + res.clinic + '）' + syncMsg);
      })
      .withFailureHandler(function(err){
        document.getElementById('tableWrap').innerHTML =
          '<div class="empty">読み込みに失敗しました：<br>'+esc(err.message)+'</div>';
      })
      .getClinicItems(clinic);
  }

  function buildCatFilter(){
    var cats = {};
    state.items.forEach(function(it){ if(it.category) cats[it.category]=1; });
    var sel = document.getElementById('catFilter');
    sel.innerHTML = '<option value="">すべて</option>';
    Object.keys(cats).forEach(function(c){
      var o=document.createElement('option'); o.value=c; o.textContent=c; sel.appendChild(o);
    });
  }

  function visibleItems(){
    var cat = document.getElementById('catFilter').value;
    var q = document.getElementById('search').value.trim();
    return state.items.filter(function(it){
      if(cat && it.category!==cat) return false;
      if(q && (it.name+it.supplier).indexOf(q)<0) return false;
      if(state.modeTab !== 'all' && it.cur !== state.modeTab) return false;
      return true;
    });
  }

  function updateModeTabCounts(){
    document.getElementById('countAll').textContent = state.items.length;
    document.getElementById('countTrigger').textContent = state.items.filter(function(it){ return it.cur === '発注トリガー管理'; }).length;
    document.getElementById('countQty').textContent = state.items.filter(function(it){ return it.cur === '数量管理'; }).length;
  }

  function render(){
    var items = visibleItems();
    if(!items.length){
      document.getElementById('tableWrap').innerHTML = '<div class="empty">該当する資材がありません。</div>';
      updateFooter(); updateSelCount();
      return;
    }
    var html = '<table><thead><tr>'
      + '<th></th><th>カテゴリ</th><th>発注先</th><th>品名</th><th>現在庫</th><th>管理方式</th>'
      + '<th>発注基準数<br><span style="font-weight:400;color:var(--sub);font-size:11px;">この数量以下で発注（数量管理のみ）</span></th>';
    if(state.live){
      html += '<th>使用期限管理<br><span style="font-weight:400;color:var(--sub);font-size:11px;">全医院に反映されます</span></th>'
           +  '<th>使用期限<br><span style="font-weight:400;color:var(--sub);font-size:11px;">今ある中で一番早い期限</span></th>';
    }
    html += '</tr></thead><tbody>';
    items.forEach(function(it){
      html += renderRow(it);
    });
    html += '</tbody></table>';
    document.getElementById('tableWrap').innerHTML = html;

    // イベント割当
    items.forEach(function(it){
      var sel = document.getElementById('mode_'+it.row);
      sel.onchange = function(){
        it.cur = this.value;
        // 数量管理以外に切り替えたら発注基準数は使わないのでクリアする
        if(it.cur !== '数量管理') it.curKijun = '';
        syncKijunInput(it);
        refreshRow(it); updateModeTabCounts(); updateFooter();
      };
      var kin = document.getElementById('kijun_'+it.row);
      if(kin){
        kin.oninput = function(){ it.curKijun = this.value; refreshRow(it); updateFooter(); };
      }
      var eman = document.getElementById('expman_'+it.row);
      if(eman){
        eman.onchange = function(){
          it.curExpMan = this.value;
          syncExpiryInput(it);
          refreshRow(it); updateFooter();
        };
      }
      var edate = document.getElementById('expdate_'+it.row);
      if(edate){
        edate.onchange = function(){ it.curExpiry = this.value; refreshRow(it); updateFooter(); };
      }
      var chk = document.getElementById('chk_'+it.row);
      chk.onchange = updateSelCount;
    });
    document.getElementById('selAll').checked = false;
    updateFooter(); updateSelCount();
  }

  function renderRow(it){
    var opts = MODE_OPTS.map(function(m){
      return '<option value="'+esc(m)+'"'+(m===it.cur?' selected':'')+'>'+esc(MODE_LABEL[m])+'</option>';
    }).join('');
    var isQty = it.cur === '数量管理';
    var kijunCell = '<input type="number" class="kijun" id="kijun_'+it.row+'" min="0" step="1"'
      + ' value="'+esc(it.curKijun)+'"'+(isQty?'':' disabled')+'>'
      + (isQty ? '<span class="kijununit" id="kunit_'+it.row+'"></span>'
               : '<span class="na" id="kunit_'+it.row+'"> —</span>');
    return '<tr id="tr_'+it.row+'" class="'+rowClass(it)+'">'
      + '<td><input type="checkbox" class="rowsel" id="chk_'+it.row+'"></td>'
      + '<td><span class="cat">'+esc(it.category)+'</span></td>'
      + '<td>'+esc(it.supplier)+'</td>'
      + '<td>'+esc(it.name)+'</td>'
      + '<td class="num">'+esc(it.stock)+'</td>'
      + '<td><select class="modesel" id="mode_'+it.row+'">'+opts+'</select></td>'
      + '<td class="kijuncell">'+kijunCell+'</td>'
      + expiryCells(it)
      + '</tr>';
  }

  // 使用期限の2列（運用中の医院のみ）。「要」のときだけ日付を入力できる。
  function expiryCells(it){
    if(!state.live) return '';
    var isManaged = it.curExpMan === EXPMAN_YES;
    var opts = [EXPMAN_NO, EXPMAN_YES].map(function(v){
      return '<option value="'+esc(v)+'"'+(v===it.curExpMan?' selected':'')+'>'+esc(v)+'</option>';
    }).join('');
    return '<td><select class="expman" id="expman_'+it.row+'">'+opts+'</select></td>'
      + '<td class="expcell"><input type="date" class="expdate" id="expdate_'+it.row+'"'
      +   ' value="'+esc(it.curExpiry)+'"'+(isManaged?'':' disabled')+'></td>';
  }

  // 使用期限管理の変更に合わせて日付入力の有効/無効を同期する
  function syncExpiryInput(it){
    var din = document.getElementById('expdate_'+it.row);
    if(!din) return;
    din.disabled = it.curExpMan !== EXPMAN_YES;
    din.value = it.curExpiry || '';
  }

  // 管理方式の変更に合わせて発注基準数入力の有効/無効・値を同期する
  function syncKijunInput(it){
    var kin = document.getElementById('kijun_'+it.row);
    var unit = document.getElementById('kunit_'+it.row);
    if(!kin) return;
    var isQty = it.cur === '数量管理';
    kin.disabled = !isQty;
    kin.value = isQty ? (it.curKijun==null?'':it.curKijun) : '';
    if(unit){
      if(isQty){ unit.textContent=''; unit.className='kijununit'; }
      else { unit.textContent=' —'; unit.className='na'; }
    }
  }

  // 発注基準数は文字列/数値が混在しうるため、比較用に正規化する（空欄は ''）
  function normKijun(v){ return (v==null?'':String(v)).trim(); }
  function isChanged(it){
    if(it.cur !== it.mode) return true;
    // 数量管理のときだけ発注基準数の変更を見る（それ以外は保存時に '' 化されるため無視）
    if(it.cur === '数量管理' && normKijun(it.curKijun) !== normKijun(it.kijun)) return true;
    if(state.live){
      if(it.curExpMan !== (it.expiryManaged || EXPMAN_NO)) return true;
      // 日付は「要」のときだけ見る（不要なら保存対象にしない）
      if(it.curExpMan === EXPMAN_YES && (it.curExpiry||'') !== (it.expiry||'')) return true;
    }
    return false;
  }
  function rowClass(it){
    var cls = [];
    if(isChanged(it)) cls.push('changed');          // 未保存の変更（黄色）
    if(it.cur === '取り扱いなし') cls.push('parked'); // 取り扱いなし（グレーで下に控える）
    return cls.join(' ');
  }
  function refreshRow(it){
    var tr = document.getElementById('tr_'+it.row);
    if(tr) tr.className = rowClass(it);
  }

  function onSelectAll(){
    var on = document.getElementById('selAll').checked;
    visibleItems().forEach(function(it){
      var chk = document.getElementById('chk_'+it.row);
      if(chk) chk.checked = on;
    });
    updateSelCount();
  }

  function checkedRows(){
    var rows = [];
    visibleItems().forEach(function(it){
      var chk = document.getElementById('chk_'+it.row);
      if(chk && chk.checked) rows.push(it);
    });
    return rows;
  }
  function updateSelCount(){
    document.getElementById('selCount').textContent = checkedRows().length;
  }

  function applyBulk(){
    var mode = document.getElementById('bulkMode').value;
    var bulkKijun = document.getElementById('bulkKijun').value.trim();
    var rows = checkedRows();
    if(!rows.length){ alert('先に対象の資材にチェックを入れてください。'); return; }
    rows.forEach(function(it){
      it.cur = mode;
      var sel = document.getElementById('mode_'+it.row);
      if(sel) sel.value = mode;
      if(mode === '数量管理'){
        // 発注基準数を入力していれば一括で上書き（空欄なら各行の既存値を維持）
        if(bulkKijun !== '') it.curKijun = bulkKijun;
      } else {
        it.curKijun = ''; // 数量管理以外は基準数を使わない
      }
      syncKijunInput(it);
      refreshRow(it);
    });
    updateModeTabCounts();
    updateFooter();
  }

  function changedItems(){
    return state.items.filter(isChanged);
  }
  function updateFooter(){
    var ch = changedItems();
    var none = ch.filter(function(it){ return it.cur==='取り扱いなし'; }).length;
    var upd = ch.length - none;
    document.getElementById('changeInfo').textContent =
      ch.length ? ('変更 '+upd+'件／取り扱いなし '+none+'件') : '変更なし';
    document.getElementById('saveBtn').disabled = ch.length===0;
  }

  function save(){
    var ch = changedItems();
    if(!ch.length) return;

    // 発注基準数の入力チェック（数量管理のみ。0以上の数値または空欄のみ許可）
    var invalid = ch.filter(function(it){
      if(it.cur !== '数量管理') return false;
      var s = normKijun(it.curKijun);
      if(s === '') return false;
      var n = Number(s);
      return isNaN(n) || n < 0;
    });
    if(invalid.length){
      alert('発注基準数は0以上の数値で入力してください。\n該当：'+invalid[0].name+' ほか'+(invalid.length-1)+'件');
      return;
    }

    var none = ch.filter(function(it){ return it.cur==='取り扱いなし'; }).length;
    // 数量管理なのに発注基準数が空欄の件数（発注候補に上がらないため注意喚起）
    var noKijun = ch.filter(function(it){
      return it.cur==='数量管理' && normKijun(it.curKijun)==='';
    }).length;

    var expManChanged = !state.live ? 0 : ch.filter(function(it){
      return it.curExpMan !== (it.expiryManaged || EXPMAN_NO);
    }).length;

    var msg = '変更を保存します。\n\n設定：'+(ch.length-none)+'件';
    if(expManChanged>0) msg += '\n\n⚠ 使用期限管理の変更：'+expManChanged+'件\n（使用期限管理は資材そのものの設定のため、他の医院にも反映されます）';
    if(none>0) msg += '\n取り扱いなし：'+none+'件（削除せず一覧の最下部に残します）';
    if(noKijun>0) msg += '\n\n⚠ 数量管理で発注基準数が未入力：'+noKijun+'件\n' +
      '（未入力のままだと発注候補に上がりません）';
    if(!confirm(msg+'\n\nよろしいですか？')) return;

    var changes = ch.map(function(it){
      var c = { row: it.row, mode: it.cur, kijun: it.cur==='数量管理' ? normKijun(it.curKijun) : '' };
      if(state.live){
        c.expiryManaged = it.curExpMan;
        // 「不要」の資材は日付を触らない（消さずに残す。「要」に戻せばそのまま使える）
        if(it.curExpMan === EXPMAN_YES) c.expiry = it.curExpiry || '';
      }
      return c;
    });
    document.getElementById('saveBtn').disabled = true;
    setStatus('保存中…');
    google.script.run
      .withSuccessHandler(function(res){
        var extra = res.expiryManagedUpdated ? ('／使用期限管理 '+res.expiryManagedUpdated+'件（全医院）') : '';
        setStatus('保存しました（更新 '+res.updated+'件'+extra+'）。再読み込みします…');
        loadClinic(); // 並び順（取り扱いなしを最下部へ）を反映するため再取得
      })
      .withFailureHandler(function(err){
        setStatus('保存に失敗しました：'+err.message);
        document.getElementById('saveBtn').disabled = false;
      })
      .saveKanri(state.clinic, changes);
  }

  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g,function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
</script>
</body>
</html>
