<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<base target="_top">
<style>
  :root{ --line:#d8dde5; --ink:#1a1a1a; --sub:#5a6270; --accent:#1e5aa8;
         --soft:#f4f6f9; --ok:#1e7a4d; --warn:#b3541e; --err:#c0392b; --na:#8a90a0; }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Yu Gothic",YuGothic,"Hiragino Kaku Gothic ProN","Meiryo",sans-serif;
       color:var(--ink);background:#eef1f5;font-size:14px;}
  header{background:#fff;border-bottom:2px solid var(--accent);padding:16px;
         box-shadow:0 1px 6px rgba(0,0,0,.06);}
  h1{font-size:18px;margin:0;}
  .sub{font-size:12.5px;color:var(--sub);margin-top:4px;}
  main{max-width:900px;margin:0 auto;padding:16px;}
  a{text-decoration:none;color:inherit;}

  .total{background:var(--accent);color:#fff;border-radius:12px;padding:18px 20px;margin-bottom:16px;}
  .total .lbl{font-size:13px;opacity:.9;}
  .total .amt{font-size:30px;font-weight:800;margin-top:2px;letter-spacing:.5px;}
  .total .meta{font-size:12.5px;opacity:.92;margin-top:6px;}

  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;}
  .clinic{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;
          box-shadow:0 1px 4px rgba(0,0,0,.05);transition:box-shadow .12s,transform .12s;}
  .clinic:hover{box-shadow:0 4px 14px rgba(0,0,0,.12);transform:translateY(-1px);}
  .clinic .name{display:flex;align-items:center;justify-content:space-between;}
  .clinic .code{font-size:16px;font-weight:800;color:var(--accent);}
  .clinic .go{font-size:12px;color:var(--sub);}
  .clinic .amt{font-size:22px;font-weight:800;margin:8px 0 2px;}
  .clinic .amt small{font-size:12px;font-weight:400;color:var(--sub);}
  .stats{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .chip{font-size:11.5px;border-radius:10px;padding:2px 9px;background:var(--soft);color:var(--sub);}
  .chip b{font-weight:800;}
  .chip.warn{background:#fdf1e7;color:var(--warn);}
  .chip.err{background:#fbe9e7;color:var(--err);}
  .chip.exp{background:#fbe9e7;color:var(--err);}
  .chip.ok{background:#e9f5ee;color:var(--ok);}

  .spin,.empty{padding:40px;text-align:center;color:var(--sub);}

  /* 理事長・事務ホームへの戻り導線。各画面で同じ見た目にそろえている。 */
  .back{display:inline-block;margin-top:18px;font-size:12.5px;color:var(--accent);font-weight:700;}
</style>
</head>
<body>
<header>
  <h1>総資産・全医院サマリ</h1>
  <div class="sub">各医院のカードから、その医院の在庫管理ホームに入れます。</div>
</header>
<main>
  <div id="app"><div class="spin">全医院を集計中…（少し時間がかかります）</div></div>
  <div style="text-align:center;"><a class="back" id="backLink" href="#">← 理事長・事務ホームへ戻る</a></div>
</main>

<script>
  var APP_URL = '<?= initParams && initParams.appUrl ? initParams.appUrl : "" ?>';
  var $ = function(id){ return document.getElementById(id); };

  $('backLink').href = APP_URL + '?page=adminhome';
  fetchSummary();

  function fetchSummary(){
    $('app').innerHTML = '<div class="spin">全医院を集計中…（少し時間がかかります）</div>';
    google.script.run
      .withSuccessHandler(render)
      .withFailureHandler(function(err){
        $('app').innerHTML = '<div class="empty">集計に失敗しました：' + esc(err && err.message) + '</div>';
      })
      .getDirectorSummary();
  }

  function render(res){
    var g = res.grand;
    var html = ''
      + '<div class="total">'
      +   '<div class="lbl">全医院 資産評価額 合計（税抜）</div>'
      +   '<div class="amt">￥' + Math.round(g.totalValuation).toLocaleString() + '</div>'
      +   '<div class="meta">' + g.count + ' 品目 ／ 在庫不足 ' + g.lowStockCount
      +       ' ／ マイナス ' + g.negativeCount + ' ／ 期限間近 ' + g.expiryCount + ' 件</div>'
      + '</div>'
      + '<div class="grid">';
    res.clinics.forEach(function(c){ html += clinicCard(c); });
    html += '</div>';
    $('app').innerHTML = html;
  }

  function clinicCard(c){
    var href = APP_URL + '?page=home&clinic=' + encodeURIComponent(c.clinic);
    var chips = '<span class="chip"><b>' + c.count + '</b> 品目</span>';
    if (c.lowStockCount) chips += '<span class="chip warn"><b>' + c.lowStockCount + '</b> 在庫不足</span>';
    if (c.negativeCount) chips += '<span class="chip err"><b>' + c.negativeCount + '</b> マイナス</span>';
    if (c.expiryCount)   chips += '<span class="chip exp">🔴 期限 <b>' + c.expiryCount + '</b></span>';
    if (!c.lowStockCount && !c.negativeCount && !c.expiryCount)
      chips += '<span class="chip ok">問題なし</span>';

    return '<a class="clinic" href="' + href + '">'
         +   '<div class="name"><span class="code">' + esc(c.clinic) + '</span>'
         +     '<span class="go">ホームへ →</span></div>'
         +   '<div class="amt">￥' + Math.round(c.totalValuation).toLocaleString()
         +     ' <small>資産額</small></div>'
         +   '<div class="stats">' + chips + '</div>'
         + '</a>';
  }

  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g,function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
</script>
</body>
</html>
