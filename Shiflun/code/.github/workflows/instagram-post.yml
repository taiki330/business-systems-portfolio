name: Instagram 自動投稿

on:
  schedule:
    # 月・水・金 の 10:00 JST (= 01:00 UTC) に投稿
    - cron: "0 1 * * 1,3,5"
  workflow_dispatch:
    # GitHub の Actions タブから手動実行もできる（テスト用）

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instagram に投稿
        env:
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: node scripts/instagram/post.mjs
