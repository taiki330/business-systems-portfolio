                        if (!ca) return;
                        ca.classList.remove('tobi-state--idle');
                        void ca.offsetWidth;
                        ca.classList.add('tobi-state--correct');
                        setTimeout(() => {
                            ca.classList.remove('tobi-state--correct');
                            ca.classList.add('tobi-state--idle');
                        }, 1500);
                    })();
                } catch (e) {
                    toast('エラー: ' + e.message);
                } finally { 
                    document.getElementById('submitOverlay').classList.remove('active'); 
                    $('btn-submit').disabled = false; 
                    $('btn-submit').textContent = state.isResendMode ? '再送する' : '送信する'; 
                }
            };

            $('report-type-actions').addEventListener('click', e => {
                const btn = e.target.closest('.btn-report');
                if (btn) {
                    const missing = [];
                    if (!$('worker-input').value.trim()) missing.push('報告者名');
                    if (!$('site-input').value.trim()) missing.push('工事現場名');
                    if (getBuildingName().trim() === '') missing.push('棟名');
                    if (!$('team-input').value.trim()) missing.push('請負業者名');
                    if (!$('company-input').value.trim()) missing.push('施工業者名');

                    if (missing.length > 0) {
                        alert("【共通情報の入力漏れ】\n\n先に以下の項目を入力してください：\n\n・" + missing.join('\n・'));
                        return;
                    }

                    if (!state.isSiteSelected) {
                        alert('【確認】工事現場名は、入力欄の下に出てくる「候補（青い枠）」の中から選んでタップしてください。\n\n※ 候補が出ない場合は、現場名がマスタに登録されていません。');
                        return;
                    }

                    state.selectedWorker = $('worker-input').value;
                    state.selectedSite = $('site-input').value;
                    state.isResendMode = false;
                    state.selectedReportType = btn.dataset.type;
                    $('btn-submit').textContent = '送信する';

                    // 午後報告・終業前報告で詰所ステータスが未取得の場合はサーバーに問い合わせ（現場×棟でキャッシュ）
                    const needsCheck = (btn.dataset.type === '午後報告' || btn.dataset.type === '終業前報告');
                    const currentSiteId = getSiteId();
                    const tsumeshoKey = getTsumeshoCacheKey();
                    if (needsCheck && currentSiteId && tsumeshoKey && !state.tsumeshoStatusCache[tsumeshoKey]) {
                        show('screen-form');
                        $('form-questions').innerHTML = '<div style="text-align:center;padding:40px;color:#64748b;">読み込み中...</div>';
                        fetchTsumeshoStatus().then(() => { renderForm(); });
                    } else {
                        renderForm();
                        show('screen-form');
                    }
                }
            });
            window.setBuildingNameMode = (mode) => {
                const input = $('building-name-input');
                const hidden = $('building-name-value');
                const btnFree = $('btn-bn-free');
                const btnIncluded = $('btn-bn-included');
                const btnNone = $('btn-bn-none');

                // Reset states
                [btnFree, btnIncluded, btnNone].forEach(b => {
                    b.classList.remove('active');
                    b.style.borderColor = '#cbd5e1';
                    b.style.backgroundColor = '#f1f5f9';
                    b.style.color = '#64748b';
                });

                if (mode === 'free') {
                    btnFree.classList.add('active');
                    input.style.display = 'block';
                    input.focus();
                    hidden.value = 'free'; // logic will read input value
                } else {
                    input.style.display = 'none';
                    if (mode === 'included') {
                        btnIncluded.classList.add('active');
                        hidden.value = '（現場名に含む）';
                    } else {
                        btnNone.classList.add('active');
                        hidden.value = '該当なし';
                    }
                }
            };

            window.getBuildingName = () => {
                const mode = $('building-name-value').value;
                if (mode === 'free') return $('building-name-input').value;
                return mode;
            };

            document.addEventListener('change', updateVisibility);
            $('btn-back').addEventListener('click', () => {
                if (state.isResendMode) show('screen-resend-type');
                else show('screen-home');
            });
            if ($('btn-back-header')) {
                $('btn-back-header').addEventListener('click', () => {
                    if (state.isResendMode && document.getElementById('screen-form').classList.contains('active')) {
                        show('screen-resend-type');
                    } else {
                        show('screen-home');
                    }
                });
            }

            $('btn-resend-start').addEventListener('click', () => {
                const missing = [];
                if (!$('worker-input').value.trim()) missing.push('報告者名');
                if (!$('site-input').value.trim()) missing.push('工事現場名');
                if (getBuildingName().trim() === '') missing.push('棟名');
                if (!$('team-input').value.trim()) missing.push('請負業者名');
                if (!$('company-input').value.trim()) missing.push('施工業者名');

                if (missing.length > 0) {
                    alert("【共通情報の入力漏れ】\n\n先に以下の項目を入力してください：\n\n・" + missing.join('\n・'));
                    return;
                }
                if (!state.isSiteSelected) {
                    alert('【確認】工事現場名は候補から選んでタップしてください。');
                    return;
                }

                // Render resend type buttons
                $('resend-type-actions').innerHTML = state.reportTypes.map(t => {
                    const info = REPORT_TYPE_INFO[t] || { icon: '📝', label: t, time: '' };
                    return `<div class="btn-report resend-action" data-type="${t}"><div class="btn-report-icon">${info.icon}</div><div class="btn-report-label">${info.label}</div></div>`;
                }).join('');

                show('screen-resend-type');
            });

            $('resend-type-actions').addEventListener('click', e => {
                const btn = e.target.closest('.resend-action');
                if (btn) {
                    state.isResendMode = true;
                    state.selectedReportType = btn.dataset.type;
                    state.resendTargetType = btn.dataset.type;
                    state.imageStore = {};
                    state.skippedStore = {};
                    state.imageRemarks = {};
                    state.selectedWorker = $('worker-input').value;
                    state.selectedSite = $('site-input').value;
                    $('btn-submit').textContent = '再送する';

                    // 再送モードでも詰所ステータスをチェック
                    const needsCheck = (btn.dataset.type === '午後報告' || btn.dataset.type === '終業前報告');
                    const currentSiteId = getSiteId();
                    const tsumeshoKey = getTsumeshoCacheKey();
                    if (needsCheck && currentSiteId && tsumeshoKey && !state.tsumeshoStatusCache[tsumeshoKey]) {
                        show('screen-form');
                        $('form-questions').innerHTML = '<div style="text-align:center;padding:40px;color:#64748b;">読み込み中...</div>';
                        fetchTsumeshoStatus().then(() => { renderForm(); });
                    } else {
                        renderForm();
                        show('screen-form');
                    }
                }
            });

            $('btn-resend-back').addEventListener('click', () => {
                state.isResendMode = false;
                state.resendTargetType = '';
                show('screen-home');
            });

            $('btn-submit').addEventListener('click', handleSubmit);
            $('btn-home').addEventListener('click', () => {
                clearDraft();
                state.imageStore = {};
                state.imageRemarks = {};
                state.repeatableData = {};
                state.isResendMode = false;
                state.resendTargetType = '';
                $('btn-submit').textContent = '送信する';
                show('screen-home');
            });
            $('btn-save-draft').addEventListener('click', () => saveDraft(true));

            // ---- 一時保存 / 自動保存 ----
            const DRAFT_KEY = 'workerReport_draft';

            // DOM上のフォーム入力値をすべて収集する
            const collectDraftFormValues = () => {
                const result = {};
                const container = $('form-questions');
                if (!container) return result;
                container.querySelectorAll('input, textarea, select').forEach(el => {
                    if (!el.id) return;
                    result[el.id] = el.type === 'checkbox' ? el.checked : el.value;
                });
                return result;
            };

            // 一時保存（showToast=trueのときトーストを表示）
            const saveDraft = (showToast) => {
                const formScreen = $('screen-form');
                if (!formScreen || !formScreen.classList.contains('active')) return;
                const data = {
                    savedAt: new Date().toISOString(),
                    selectedSite: state.selectedSite,
                    selectedWorker: state.selectedWorker,
                    selectedReportType: state.selectedReportType,
                    isResendMode: state.isResendMode,
                    resendTargetType: state.resendTargetType,
                    teamName: state.teamName,
                    companyName: state.companyName,
                    isSiteSelected: state.isSiteSelected,
                    imageStore: state.imageStore,
                    skippedStore: state.skippedStore,
                    imageRemarks: state.imageRemarks,
                    repeatableData: state.repeatableData,
                    formValues: collectDraftFormValues()
                };
                try {
                    localStorage.setItem(DRAFT_KEY, JSON.stringify(data));
                } catch (e) {
                    // QuotaExceededError: 画像なしで再試行
                    data.imageStore = {};
                    try { localStorage.setItem(DRAFT_KEY, JSON.stringify(data)); } catch (_) { }
                }
                if (showToast) showDraftToast('一時保存しました ✓');
            };

            // 下書き削除
            const clearDraft = () => localStorage.removeItem(DRAFT_KEY);

            // トースト表示（2秒後に消える）
            const showDraftToast = (msg) => {
                const toast = $('draft-toast');
                if (!toast) return;
                toast.textContent = msg;
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2000);
            };

            // 復元: stateを更新 → フォームをレンダリング → DOM値を適用
            const restoreDraft = (draft) => {
                state.selectedSite = draft.selectedSite || '';
                state.selectedWorker = draft.selectedWorker || '';
                state.selectedReportType = draft.selectedReportType || '';
                state.isResendMode = !!draft.isResendMode;
                state.resendTargetType = draft.resendTargetType || draft.selectedReportType || '';
                state.teamName = draft.teamName || '';
                state.companyName = draft.companyName || '';
                state.isSiteSelected = draft.isSiteSelected || false;
                state.imageStore = draft.imageStore || {};
                state.skippedStore = draft.skippedStore || {};
                state.imageRemarks = draft.imageRemarks || {};
                state.repeatableData = draft.repeatableData || {};

                renderForm();
                show('screen-form');

                // レンダリング完了後にDOM値を適用
                setTimeout(() => {
                    const formValues = draft.formValues || {};
                    Object.entries(formValues).forEach(([id, value]) => {
                        const el = document.getElementById(id);
                        if (!el) return;
                        if (el.type === 'checkbox') {
                            el.checked = !!value;
                            el.dispatchEvent(new Event('change'));
                        } else if (el.type === 'number' && id.indexOf('slider-') === 0) {
                            el.value = value;
                        } else if (id.startsWith('switch-')) {
                            // switch: setSwitch でUI更新
                            const qId = id.replace('switch-', '');
                            if (value) window.setSwitch(qId, value);
                        } else {
                            el.value = value;
                        }
                    });
                    // 画像プレビューを復元
                    Object.keys(state.imageStore).forEach(qId => renderImageGrid(qId));
                    // 備考を復元
                    Object.entries(state.imageRemarks).forEach(([qId, val]) => {
                        const el = document.getElementById(`remarks-${qId}`);
                        if (el) el.value = val;
                    });
                    updateVisibility();
                }, 100);
            };

            // ページ読み込み時: 下書きがあれば復元を確認
            const loadDraftIfExists = () => {
                const raw = localStorage.getItem(DRAFT_KEY);
                if (!raw) return;
                let draft;
                try { draft = JSON.parse(raw); } catch (_) { clearDraft(); return; }
                if (!draft.selectedReportType) { clearDraft(); return; }
                const savedAt = new Date(draft.savedAt).toLocaleString('ja-JP');
                const msg = `前回の入力途中データがあります（${savedAt}）\n\n${draft.selectedReportType} / ${draft.selectedWorker || '氏名未入力'}\n\n復元しますか？`;
                if (confirm(msg)) {
                    restoreDraft(draft);
                    if (state.isResendMode) {
                        $('btn-submit').textContent = '再送する';
                    }
                } else {
                    clearDraft();
                }
            };

            // 30秒ごとに自動保存
            setInterval(() => saveDraft(false), 30000);

            initData(); renderHome(); loadDraftIfExists();
        })();
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.14.0/Sortable.min.js"></script>
    <script>
        /* Admin App Logic */
        const AdminApp = (() => {
            let fullConfig = null;
            let currentReportType = null;
            let activeTab = 'active'; // 'active' or 'inactive'
            let sortable = null;

            const init = async () => {
                try {
                    const res = await new Promise((resolve, reject) =>
                        google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).getAdminConfig()
                    );
                    fullConfig = res;
                    renderReportTypes();
                } catch (e) {
                    alert('設定の読み込みに失敗しました: ' + e.message);
                }
            };

            const renderReportTypes = () => {
                const uniqueTypes = [...new Set(fullConfig.questions.map(q => q.reportType))];
                const container = document.getElementById('admin-report-types');
                container.innerHTML = uniqueTypes.map(type => `
          <div class="btn-report" onclick="AdminApp.selectReportType('${type}')" style="display:flex; justify-content:space-between; align-items:center;">
             <span>${type}</span>
             <span style="font-size:20px;">›</span>
          </div>
        `).join('');
            };

            const selectReportType = (type) => {
                currentReportType = type;
                document.getElementById('admin-list-title').textContent = type;
                show('screen-admin-list');
                renderQuestions();
            };

            const switchTab = (tab) => {
                activeTab = tab;
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.getElementById(`tab-${tab}`).classList.add('active');
                renderQuestions();
            };

            const renderQuestions = () => {
                const list = document.getElementById('admin-questions-list');
                const questions = fullConfig.questions
                    .filter(q => q.reportType === currentReportType)
                    .filter(q => activeTab === 'active' ? (q.active !== false) : (q.active === false))
                    .sort((a, b) => (a.sortOrder || 0) - (b.sortOrder || 0));

                list.innerHTML = questions.map(q => {
                    const locked = q.systemLocked ? '<span style="font-size:14px;">🔒</span>' : '';
                    const typeLabel = getTypeLabel(q.inputType);
                    const reqBadge = q.required ? '<span class="admin-badge badge-req">必須</span>' : '';
                    const skipBadge = q.showSkip ? '<span class="admin-badge badge-skip">該当なし有</span>' : '';

                    let actions = '';
                    if (activeTab === 'active') {
                        const deleteLimit = q.systemLocked ? 'disabled' : '';
                        actions = `
              <button class="btn-icon" onclick="AdminApp.openEditModal('${q.id}')">✏️</button>
              <button class="btn-icon ${deleteLimit}" onclick="${deleteLimit ? '' : `AdminApp.toggleActive('${q.id}', false)`}">👁️‍🗨️</button>
            `;
                    } else {
                        actions = `
              <button class="btn-icon" onclick="AdminApp.toggleActive('${q.id}', true)">♻️ 復活</button>
            `;
                    }

                    return `
            <div class="admin-card ${q.systemLocked ? 'is-locked' : ''} ${!q.active ? 'is-inactive' : ''}" data-id="${q.id}">
              <div class="admin-card-handle" style="${activeTab === 'active' ? '' : 'display:none'}">☰</div>
              <div class="admin-card-content">
                <div class="admin-card-title">${locked} ${q.displayLabel || q.label}</div>
                <div class="admin-card-meta">
                  <span class="admin-badge badge-type">${typeLabel}</span>
                  ${reqBadge}
                  ${skipBadge}
                </div>
              </div>
              <div class="admin-actions">
                ${actions}
              </div>
            </div>
          `;
                }).join('');

                if (activeTab === 'active') {
                    if (sortable) sortable.destroy();
                    sortable = new Sortable(list, {
                        handle: '.admin-card-handle',
                        animation: 150,
                        ghostClass: 'sortable-ghost',
                        onEnd: () => {
                            // Update sortOrder based on new DOM order
                            const items = Array.from(list.children);
                            items.forEach((item, index) => {
                                const qId = item.dataset.id;
                                const q = fullConfig.questions.find(fq => fq.id === qId);
                                if (q) q.sortOrder = index + 1;
                            });
                        }
                    });
                }
            };

            const getTypeLabel = (type) => {
                const mat = {
                    'text': '文字', 'switch': 'はい/いいえ', 'image': '写真', 'image_text': '写真+コメ',
                    'select': '選択', 'checkbox': '複数', 'check': '単一', 'slider': '数値(%)', 'number': '数値'
                };
                return mat[type] || type;
            };

            const toggleActive = (id, isActive) => {
                const q = fullConfig.questions.find(q => q.id === id);
                if (q) {
                    q.active = isActive;
                    renderQuestions();
                }
            };

            // Modal handling
            let editingId = null;

            const openEditModal = (id) => {
                editingId = id;
                const q = id ? fullConfig.questions.find(x => x.id === id) : {
                    label: '', inputType: 'text', required: false, showSkip: false, meta: {}, options: []
                };

                document.getElementById('edit-id').value = id || '';
                document.getElementById('edit-label').value = q.displayLabel || q.label || '';
                document.getElementById('edit-type').value = q.inputType || 'text';
                document.getElementById('edit-helper').value = q.helperText || '';

                // Populate toggles
                setToggle('req', !!q.required);
                setToggle('skip', !!q.showSkip);

                // Lock systemLocked items (cannot change type or label if it's super locked? Spec says label is editable)
                const typeSelect = document.getElementById('edit-type');
                typeSelect.disabled = !!q.systemLocked;
                if (q.systemLocked) document.getElementById('edit-type-warning').style.display = 'block';
                else document.getElementById('edit-type-warning').style.display = 'none';

                // Options
                document.getElementById('edit-options').value = (q.options || []).join('\n');

                // Show/Hide relevant fields
                handleTypeChange();

                document.getElementById('modal-question-edit').classList.add('is-visible');
            };

            const closeModal = () => {
                document.getElementById('modal-question-edit').classList.remove('is-visible');
            };

            const setToggle = (key, state) => {
                document.getElementById(`edit-${key}`).value = state;
                document.getElementById(`edit-${key}-true`).classList.toggle('active', state);
                document.getElementById(`edit-${key}-false`).classList.toggle('active', !state);
            };

            const handleTypeChange = () => {
                const type = document.getElementById('edit-type').value;
                const isImage = type === 'image' || type === 'image_text';
                const isChoice = ['select', 'checkbox', 'check_text_group'].includes(type);

                document.getElementById('group-skip').style.display = isImage ? 'flex' : 'none';
                document.getElementById('group-options').style.display = isChoice ? 'block' : 'none';
            };

            const saveModal = () => {
                const label = document.getElementById('edit-label').value;
                if (!label.trim()) { alert('項目名は必須です'); return; }

                const type = document.getElementById('edit-type').value;
                const required = document.getElementById('edit-req').value === 'true';
                const showSkip = document.getElementById('edit-skip').value === 'true';
                const helperText = document.getElementById('edit-helper').value;
                const options = document.getElementById('edit-options').value.split('\n').map(s => s.trim()).filter(Boolean);

                if (editingId) {
                    // Update existing
                    const q = fullConfig.questions.find(x => x.id === editingId);
                    q.displayLabel = label; // Only update displayLabel to preserve internal label connection
                    if (!q.systemLocked) q.inputType = type;
                    q.required = required;
                    q.showSkip = showSkip;
                    q.helperText = helperText;
                    q.options = options;
                } else {
                    // Create new
                    const newQ = {
                        id: `Q_${new Date().getTime()}`,
                        reportType: currentReportType,
                        label: label, // For new items, label = displayLabel
                        displayLabel: label,
                        inputType: type,
                        required: required,
                        active: true,
                        showSkip: showSkip,
                        helperText: helperText,
                        options: options,
                        sortOrder: 999,
                        systemLocked: false,
                        meta: { skipLabel: '該当なし' }
                    };
                    fullConfig.questions.push(newQ);
                }

                closeModal();
                renderQuestions();
            };

            const saveChanges = async () => {
                if (!confirm('変更を保存して、全ユーザーに反映しますか？')) return;

                // Show loading
                const btn = document.querySelector('#screen-admin-list .header button');
                const origText = btn.textContent;
                btn.textContent = '保存中...';
                btn.disabled = true;

                try {
                    const res = await new Promise((resolve, reject) =>
                        google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).saveAdminConfigFromClient(fullConfig)
                    );

                    if (res.warnings && res.warnings.length > 0) {
                        alert('保存しましたが、以下の警告があります：\n・' + res.warnings.join('\n・'));
                    } else {
                        alert('保存しました！(v' + res.version + ')');
                    }
                    location.reload(); // Reload to reflect changes
                } catch (e) {
                    alert('保存エラー: ' + e.message);
                    btn.textContent = origText;
                    btn.disabled = false;
                }
            };

            return {
                init,
                selectReportType,
                switchTab,
                toggleActive,
                openEditModal,
                closeModal,
                setToggle,
                handleTypeChange,
                saveModal,
                saveChanges
            };
        })();

        // Global auth handler
        window.showAdminAuth = () => show('screen-admin-auth');

        window.handleAdminAuth = async () => {
            const pass = document.getElementById('admin-passcode').value;
            try {
                const valid = await new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej).validatePasscode(pass));
                if (valid) {
                    show('screen-admin-select');
                    AdminApp.init();
                } else {
                    alert('パスワードが違います');
                }
            } catch (e) {
                alert('認証エラー: ' + e.message);
            }
        };
    </script>
    <div id="draft-toast"></div>
</body>
